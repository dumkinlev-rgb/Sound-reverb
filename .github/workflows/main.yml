name: Build Android App with Buildozer
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache automake libtool pkg-config libssl-dev libffi-dev libgmp-dev zlib1g-dev lld openjdk-17-jdk

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    # СОЗДАЕМ ССЫЛКУ ДЛЯ СТАРОГО ПУТИ SDKMANAGER, КОТОРЫЙ ИЩЕТ BUILDOZER
    - name: Fix sdkmanager path for Buildozer
      run: |
        sudo mkdir -p /usr/local/lib/android/sdk/tools/bin
        sudo ln -s /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager /usr/local/lib/android/sdk/tools/bin/sdkmanager

    - name: Accept All Android Licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Build with Buildozer
      run: |
        buildozer android release

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Android-APK
        path: bin/*.apk
