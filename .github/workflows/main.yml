name: Build Android App with Buildozer
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Устанавливаем все системные инструменты для компиляции Kivy и Numpy под Android
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache automake libtool pkg-config libssl-dev libffi-dev libgmp-dev zlib1g-dev lld openjdk-17-jdk

    # Ставим сам Buildozer и зависимости на виртуальную машину через pip
    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    # Запускаем прямую сборку
    - name: Build with Buildozer
      run: |
        buildozer android release

    # Сохраняем готовый APK-файл
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Android-APK
        path: bin/*.apk
